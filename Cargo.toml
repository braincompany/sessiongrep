[package]
name = "sessiongrep"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.88"
description = "Local-first memory layer for CLI agents: search, inspect, export, and resume Claude Code, Codex CLI, Cursor, Antigravity, and Pi sessions, with an MCP server for agent-driven recall."
license = "Apache-2.0"
repository = "https://github.com/braincompany/sessiongrep"
readme = "README.md"
keywords = ["cli", "search", "mcp", "claude-code", "codex"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
fuzzy-matcher = "0.3"
ignore = "0.4"
ratatui = "0.29"
regex = "1.12"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
thiserror = "2.0"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "sessiongrep"
path = "src/main.rs"

[[bin]]
name = "sessiongrep-mcp"
path = "src/mcp.rs"

[dev-dependencies]
tempfile = "3.23"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
