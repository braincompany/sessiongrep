[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Build every artifact on PRs (without publishing) to verify the release pipeline
pr-run-mode = "upload"
# Whether to install an updater program
install-updater = false
# Archive format for macOS/Linux builds (gzip is available everywhere; xz is not)
unix-archive = ".tar.gz"

# GitHub's Intel macOS runners (macos-15-intel) weren't available to this repo,
# so cross-compile the Intel build on the Apple Silicon runner instead.
[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
